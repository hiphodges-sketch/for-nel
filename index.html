<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little surprise</title>
<meta name="theme-color" content="#dcecfb">
<style>
  :root { --bg1:#eef6ff; --bg2:#bcd9f3; --accent:#f28b6f; --accent2:#ffb088; --ink:#2f4059; --ink-soft:#5d7390; --card:#fbfdff; --paper:#e6eff8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: radial-gradient(120% 90% at 50% 0%, var(--bg1) 0%, var(--bg2) 100%);
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%; overscroll-behavior: none; touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  main { flex: 1; min-height: 0; width: 100%; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #open {
    appearance: none; border: 0; cursor: pointer; font: inherit;
    font-size: clamp(1.2rem, 2.4vw + 0.6rem, 1.8rem); font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    padding: 1.1em 2.2em; border-radius: 999px; max-width: 92vw; text-align: center;
    box-shadow: 0 12px 30px rgba(242,139,111,.4), inset 0 1px 0 rgba(255,255,255,.35);
    animation: breathe 2.6s ease-in-out infinite;
    transition: transform .25s ease, opacity .45s ease; -webkit-tap-highlight-color: transparent;
  }
  #open:active { transform: scale(.97); }
  #open.leaving { animation: none; opacity: 0; transform: scale(.85); pointer-events: none; }
  @keyframes breathe { 0%,100% { transform: scale(1);} 50% { transform: scale(1.04);} }
  #stage { display: none; flex: 1; min-height: 0; width: 100%; flex-direction: column; align-items: center; justify-content: center; gap: clamp(12px, 2.5vh, 26px); }
  #stage.show { display: flex; }
  .note { opacity: 0; transform: translateY(8px); transition: opacity 1.1s ease, transform 1.1s ease; text-align: center; max-width: 36rem; font-size: clamp(.98rem, .9vw + .8rem, 1.22rem); line-height: 1.5; margin: 0 6px; }
  .note.show { opacity: 1; transform: none; }
  .note .sig { display: block; margin-top: .35em; font-style: italic; color: var(--ink-soft); }
  .hint { font-size: .82rem; color: var(--ink-soft); opacity: 0; transition: opacity 1s ease .4s; margin: 0; }
  .hint.show { opacity: .85; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  .bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  main, #confetti { position: relative; z-index: 1; }
  #confetti { position: fixed; }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: drift 26s ease-in-out infinite alternate; }
  .blob.a { width: 46vmax; height: 46vmax; left: -12vmax; top: -14vmax; background: #ffffff; }
  .blob.b { width: 38vmax; height: 38vmax; right: -10vmax; top: 18vh; background: #ffe3d2; animation-delay: -9s; animation-duration: 32s; }
  .blob.c { width: 40vmax; height: 40vmax; left: 10vw; bottom: -18vmax; background: #a9cff2; animation-delay: -17s; animation-duration: 29s; }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(6vw, 4vh) scale(1.08); } }
  .piece { position: absolute; bottom: -4vh; width: 8px; height: 12px; border-radius: 3px; opacity: 0; background: #fff;
    animation: rise linear infinite; will-change: transform, opacity; }
  .piece.round { border-radius: 50%; width: 7px; height: 7px; }
  .piece.peach { background: #ffd4bf; } .piece.blue { background: #9ec8ee; } .piece.gold { background: #ffe6a8; }
  @keyframes rise {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: .75; }
    92%  { opacity: .75; }
    100% { transform: translate3d(var(--sway), -110vh, 0) rotate(var(--spin)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { #open { animation: none; } .blob, .piece { animation: none; } .piece { display: none; } }

  .duo { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(16px, 3vh, 36px); width: 100%; }
  @media (min-width: 720px) { .duo { flex-direction: row; gap: 56px; } }
  .letter { background: #fdfeff; padding: 22px 26px; border-radius: 4px; max-width: 360px; font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(.98rem, .8vw + .85rem, 1.18rem); line-height: 1.55; color: var(--ink);
    box-shadow: 0 10px 26px rgba(47,64,89,.16), 0 1px 3px rgba(47,64,89,.08);
    opacity: 0; transform: translateY(30px) rotate(-1.5deg); transition: opacity 1s ease, transform 1s cubic-bezier(.22,1,.36,1); }
  .letter.show { opacity: 1; transform: rotate(-1.5deg); }
  .letter p { margin: 0 0 .7em; } .letter p:last-child { margin: 0; font-style: italic; color: var(--ink-soft); text-align: right; }
  .flip { perspective: 1200px; width: min(68vw, 320px); height: min(40vh, 380px); height: min(40dvh, 380px); cursor: pointer; opacity: 0; transition: opacity .7s ease; }
  .flip.show { opacity: 1; }
  .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.4,0,.2,1); transform: rotateY(-90deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card); padding: 10px 10px 34px; border-radius: 6px;
    box-shadow: 0 12px 28px rgba(47,64,89,.2), 0 2px 6px rgba(47,64,89,.08); }
  .face.back { transform: rotateY(180deg); }
  .face img { width: 100%; height: 100%; object-fit: contain; border-radius: 3px; background: var(--paper); }
  .hint { text-align: center; }
</style>
</head>

      <p>Dear Nel,</p>
      <p>thank you for opening the door last weekend, and for it all. I wanted to vibe code a website, and what a better use of my time than doing this for a special someone :)</p>
